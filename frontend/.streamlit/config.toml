[theme]
base = "light"
primaryColor = "#4f46e5"
backgroundColor = "#f7f8fc"
secondaryBackgroundColor = "#eef1fb"
textColor = "#111827"
borderColor = "#e3e7f1"
linkColor = "#4f46e5"
greenColor = "#10b981"
redColor = "#ef4444"
